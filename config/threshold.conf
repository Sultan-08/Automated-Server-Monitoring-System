# ============================================================
# Automated Server Monitoring & Alert System
# Configuration File
# ============================================================
#
# This file contains configurable values used by the monitoring
# system.
#
# Do not place monitoring logic in this file.
# Monitoring modules will load these values using Bash "source".
# ============================================================


# ------------------------------------------------------------
# CPU Usage Threshold
# ------------------------------------------------------------
# Maximum CPU usage percentage allowed before the monitoring
# system considers CPU usage to be high.
#
# Valid range: 0-100
#
CPU_THRESHOLD=80


# ------------------------------------------------------------
# Memory Usage Threshold
# ------------------------------------------------------------
# Maximum memory usage percentage allowed before the monitoring
# system considers memory usage to be high.
#
# Valid range: 0-100
#
MEMORY_THRESHOLD=80


# ------------------------------------------------------------
# Disk Usage Threshold
# ------------------------------------------------------------
# Maximum disk usage percentage allowed before the monitoring
# system considers disk usage to be high.
#
# Valid range: 0-100
#
DISK_THRESHOLD=85


# ------------------------------------------------------------
# Administrator Email
# ------------------------------------------------------------
# Email address that will receive monitoring alerts.
#
# IMPORTANT:
# Replace the example address with the administrator's actual
# email address before enabling email alerts.
#
ADMIN_EMAIL="sultan.y.mulani@gmail.com"


# ------------------------------------------------------------
# Services to Monitor
# ------------------------------------------------------------
# Space-separated list of Linux services that the monitoring
# system will check in a later phase.
#
# Example:
# SERVICES="ssh"
#
# Multiple services can eventually be specified like this:
# SERVICES="ssh cron nginx"
#
SERVICES="cron"
